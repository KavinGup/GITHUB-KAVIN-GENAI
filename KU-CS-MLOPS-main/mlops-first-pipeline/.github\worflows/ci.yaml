name: Iris ML API-CI Pipeline

on:
  # Run CI when code is pushed or a pull request is opened on the main branch
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mlops-first-pipeline

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python on Runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run automated tests
        run: python -m pytest -v

      - name: Build Docker Image
        run: docker build -t iris-ml-apis:${{ github.sha }} .